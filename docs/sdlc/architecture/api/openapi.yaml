# Generated by QuorQ AI SDLC from the approved architecture. This file is overwritten on every publish; edit the architecture instead.
openapi: 3.1.0
info:
  title: TimeTrack Pro V1
  version: architecture-v1
  description: Designed API from the approved architecture (not extracted from code).
paths:
  /api/admin/clients:
    get:
      summary: List clients, including archived ones.
      description: List clients, including archived ones.
      operationId: get_api_admin_clients
      parameters: []
      responses:
        '200':
          description: '[Client]'
      security:
      - bearerAuth: []
    post:
      summary: Create a client with a unique name (AC-017).
      description: Create a client with a unique name (AC-017).
      operationId: post_api_admin_clients
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{name}'
      responses:
        '200':
          description: 201 Client, or 409 for a duplicate name
      security:
      - bearerAuth: []
  /api/admin/clients/{id}:
    patch:
      summary: Rename a client, or archive or unarchive it (AC-018).
      description: Rename a client, or archive or unarchive it (AC-018).
      operationId: patch_api_admin_clients_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{name?, archived?}'
      responses:
        '200':
          description: 200 Client
      security:
      - bearerAuth: []
  /api/admin/projects:
    post:
      summary: Create a project under a client with an hourly bill rate (reporting
        only) and a default billable flag (AC-019, AC-020).
      description: Create a project under a client with an hourly bill rate (reporting
        only) and a default billable flag (AC-019, AC-020).
      operationId: post_api_admin_projects
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{client_id, name, hourly_bill_rate >= 0, default_billable?}'
      responses:
        '200':
          description: 201 Project, or 422 for an invalid rate
      security:
      - bearerAuth: []
  /api/admin/projects/{id}:
    patch:
      summary: Edit name, rate or default billable flag, or archive. Existing entries
        are untouched (AC-021).
      description: Edit name, rate or default billable flag, or archive. Existing
        entries are untouched (AC-021).
      operationId: patch_api_admin_projects_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{name?, hourly_bill_rate?, default_billable?, archived?}'
      responses:
        '200':
          description: 200 Project
      security:
      - bearerAuth: []
  /api/admin/projects/{id}/tasks:
    post:
      summary: Add a task to a project (AC-023).
      description: Add a task to a project (AC-023).
      operationId: post_api_admin_projects_id_tasks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{name}'
      responses:
        '200':
          description: 201 Task
      security:
      - bearerAuth: []
  /api/admin/tasks/{id}:
    patch:
      summary: Rename or archive a task (AC-024).
      description: Rename or archive a task (AC-024).
      operationId: patch_api_admin_tasks_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{name?, archived?}'
      responses:
        '200':
          description: 200 Task
      security:
      - bearerAuth: []
  /api/admin/users:
    get:
      summary: List users with role, manager and active status (AC-006).
      description: List users with role, manager and active status (AC-006).
      operationId: get_api_admin_users
      parameters: []
      responses:
        '200':
          description: '[User]'
      security:
      - bearerAuth: []
    post:
      summary: Create a user and email a set-password link (US-004). Returns 409 on
        a duplicate email and 422 per field on validation e
      description: Create a user and email a set-password link (US-004). Returns 409
        on a duplicate email and 422 per field on validation errors.
      operationId: post_api_admin_users
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{full_name, email, role, time_zone, manager_id?}'
      responses:
        '200':
          description: 201 User
      security:
      - bearerAuth: []
  /api/admin/users/{id}:
    patch:
      summary: Edit name, role, manager or time zone (US-005, US-006). The manager
        must be an active user with the manager role.
      description: Edit name, role, manager or time zone (US-005, US-006). The manager
        must be an active user with the manager role.
      operationId: patch_api_admin_users_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{full_name?, role?, manager_id?, time_zone?}'
      responses:
        '200':
          description: 200 User, or 422 for an invalid manager
      security:
      - bearerAuth: []
  /api/admin/users/{id}/deactivate:
    post:
      summary: Deactivate the user and revoke their sessions. Time entries are kept
        (AC-016).
      description: Deactivate the user and revoke their sessions. Time entries are
        kept (AC-016).
      operationId: post_api_admin_users_id_deactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '-'
      responses:
        '200':
          description: 200 User
      security:
      - bearerAuth: []
  /api/auth/login:
    post:
      summary: Sign in (US-001). Returns a generic 401 on any failure.
      description: Sign in (US-001). Returns a generic 401 on any failure.
      operationId: post_api_auth_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{email, password}'
      responses:
        '200':
          description: 200 {user:{id, full_name, role, time_zone}} plus Set-Cookie
            session (HttpOnly, Secure, SameSite=Strict)
  /api/auth/logout:
    post:
      summary: Revoke the current session and clear the cookie (AC-003).
      description: Revoke the current session and clear the cookie (AC-003).
      operationId: post_api_auth_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '-'
      responses:
        '200':
          description: '204'
      security:
      - bearerAuth: []
  /api/auth/me:
    get:
      summary: Return the current user and role for routing to the role home page.
      description: Return the current user and role for routing to the role home page.
      operationId: get_api_auth_me
      parameters: []
      responses:
        '200':
          description: '{id, email, full_name, role, time_zone}'
      security:
      - bearerAuth: []
  /api/auth/password-reset/confirm:
    post:
      summary: Set a new password with a single-use token. Also used to set the first
        password after admin creation.
      description: Set a new password with a single-use token. Also used to set the
        first password after admin creation.
      operationId: post_api_auth_password_reset_confirm
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{token, new_password}'
      responses:
        '200':
          description: 204, or 400 if the token is invalid, expired or used, or the
            password breaks the rules
      security:
      - bearerAuth: []
  /api/auth/password-reset/request:
    post:
      summary: Request a reset link. Always returns the same response (AC-009).
      description: Request a reset link. Always returns the same response (AC-009).
      operationId: post_api_auth_password_reset_request
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{email}'
      responses:
        '200':
          description: 202 {message}
  /api/clock/breaks/end:
    post:
      summary: End the open break (AC-028).
      description: End the open break (AC-028).
      operationId: post_api_clock_breaks_end
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '-'
      responses:
        '200':
          description: 200 Break
      security:
      - bearerAuth: []
  /api/clock/breaks/start:
    post:
      summary: Start a break on the running entry. Returns 409 if a break is already
        open (AC-030).
      description: Start a break on the running entry. Returns 409 if a break is already
        open (AC-030).
      operationId: post_api_clock_breaks_start
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '-'
      responses:
        '200':
          description: 201 Break
      security:
      - bearerAuth: []
  /api/clock/in:
    post:
      summary: Start a running entry (AC-025). Returns 409 if one is already running
        (AC-027).
      description: Start a running entry (AC-025). Returns 409 if one is already running
        (AC-027).
      operationId: post_api_clock_in
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{project_id, task_id, billable?}'
      responses:
        '200':
          description: 201 TimeEntry
      security:
      - bearerAuth: []
  /api/clock/out:
    post:
      summary: Close any open break and the running entry (AC-026, AC-029).
      description: Close any open break and the running entry (AC-026, AC-029).
      operationId: post_api_clock_out
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '-'
      responses:
        '200':
          description: 200 TimeEntry with worked_minutes
      security:
      - bearerAuth: []
  /api/clock/status:
    get:
      summary: Current running entry and open break, with a stale flag if the entry
        started on an earlier local day (AC-031).
      description: Current running entry and open break, with a stale flag if the
        entry started on an earlier local day (AC-031).
      operationId: get_api_clock_status
      parameters: []
      responses:
        '200':
          description: '{running_entry?, open_break?, stale:boolean}'
      security:
      - bearerAuth: []
  /api/dashboard/week:
    get:
      summary: Current local week totals, per-day hours and billable versus non-billable
        split (US-016).
      description: Current local week totals, per-day hours and billable versus non-billable
        split (US-016).
      operationId: get_api_dashboard_week
      parameters: []
      responses:
        '200':
          description: '{week_start, total_hours, per_day[7], billable_hours, non_billable_hours}'
      security:
      - bearerAuth: []
  /api/projects:
    get:
      summary: Active projects with active tasks and the billable default, for entry
        pickers. The bill rate is not returned to non-admi
      description: Active projects with active tasks and the billable default, for
        entry pickers. The bill rate is not returned to non-admins.
      operationId: get_api_projects
      parameters: []
      responses:
        '200':
          description: '[{id, client_name, name, default_billable, tasks:[{id, name}]}]'
      security:
      - bearerAuth: []
  /api/time-entries/{id}:
    patch:
      summary: Edit the day, hours, project, task, billable flag or times of an own
        entry (AC-039).
      description: Edit the day, hours, project, task, billable flag or times of an
        own entry (AC-039).
      operationId: patch_api_time_entries_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{work_date?, hours?, project_id?, task_id?, billable?,
                started_at?, ended_at?}'
      responses:
        '200':
          description: 200 TimeEntry, or 403 if not the owner (AC-041)
      security:
      - bearerAuth: []
    delete:
      summary: Delete an own entry and its breaks (AC-040).
      description: Delete an own entry and its breaks (AC-040).
      operationId: delete_api_time_entries_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 204, or 403 if not the owner
      security:
      - bearerAuth: []
  /api/time-entries/{id}/end:
    patch:
      summary: Set the end time of a forgotten running entry. Returns 422 if it is
        before the start (AC-032).
      description: Set the end time of a forgotten running entry. Returns 422 if it
        is before the start (AC-032).
      operationId: patch_api_time_entries_id_end
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{ended_at (ISO with offset)}'
      responses:
        '200':
          description: 200 TimeEntry
      security:
      - bearerAuth: []
  /api/timesheets/cells:
    put:
      summary: Upsert a manual hours cell (0 to 24 hours). Hours of 0 delete the cell.
      description: Upsert a manual hours cell (0 to 24 hours). Hours of 0 delete the
        cell.
      operationId: put_api_timesheets_cells
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{work_date, project_id, task_id, billable?, hours}'
      responses:
        '200':
          description: 200 updated row and totals, or 422 validation message
      security:
      - bearerAuth: []
  /api/timesheets/{week_start}:
    get:
      summary: Monday-to-Sunday week view with manual and clocked entries and totals
        (US-013). Returns 422 if week_start is not a Monda
      description: Monday-to-Sunday week view with manual and clocked entries and
        totals (US-013). Returns 422 if week_start is not a Monday.
      operationId: get_api_timesheets_week_start
      parameters:
      - name: week_start
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{days[7], rows:[{project, task, billable, cells[7]}], daily_totals[7],
            week_total}'
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    users:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        password_hash:
          type: string
        role:
          type: string
        time_zone:
          type: string
        manager_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - full_name
      - role
      - time_zone
      - is_active
      - created_at
      - updated_at
    sessions:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - token_hash
      - created_at
      - expires_at
    password_tokens:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        purpose:
          type: string
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - token_hash
      - purpose
      - expires_at
    clients:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archived_at:
          type: string
          format: date-time
      required:
      - id
      - name
    projects:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        name:
          type: string
        hourly_bill_rate:
          type: number
        default_billable:
          type: boolean
        archived_at:
          type: string
          format: date-time
      required:
      - id
      - client_id
      - name
      - hourly_bill_rate
    tasks:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        archived_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - name
    time_entries:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        source:
          type: string
        billable:
          type: boolean
        work_date:
          type: string
          format: date
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - project_id
      - task_id
      - source
      - billable
      - work_date
      - created_at
      - updated_at
    breaks:
      type: object
      properties:
        id:
          type: string
          format: uuid
        time_entry_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
      required:
      - id
      - time_entry_id
      - started_at
    app_settings:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
      required:
      - key
      - value
